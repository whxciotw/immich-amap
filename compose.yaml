# Immich 高德地图：纠偏代理 + 样式静态托管
#
# 用法（任意 Docker 主机）：
#   cp .env.example .env && docker compose up -d
#
# 如果 Immich 已经用自己的 compose 管理，推荐只把下面两个 service
# 合并进已有的 compose 文件，再 `docker compose up -d tile-proxy mapstyle`
# （不要整项目 up，避免影响 Immich 自身的容器）。
#
# 需要发布到局域网的是 9002/9003：瓦片和样式都由浏览器直接请求。

name: immich-amap

services:
  # ① GCJ-02 纠偏代理：把高德 GCJ-02 瓦片按 WGS-84 网格重采样。
  #    容器需要能访问 *.is.autonavi.com。
  tile-proxy:
    image: negiao/tile-proxy:1.1.0
    container_name: tile-proxy
    restart: unless-stopped
    ports:
      - "${TILE_PROXY_PORT:-9002}:9002"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # 内网使用，关闭限流（端口映射后所有请求共用同一个源 IP，开限流容易误伤）
      PROXY_RATE_LIMIT: "0"
      GCJRE_CACHE: /data/cache
      GCJRE_CACHE_MAX_MB: "512"
      GCJRE_CACHE_MAX_AGE_DAYS: "3"
    volumes:
      - tile-proxy-cache:/data/cache
      - "${DATA_DIR:-./data}/tile-proxy-admin:/data/admin"
    mem_limit: 256m

  # ② 样式静态托管：手机端 maplibre_gl 只接受 http(s) 的 style URL；
  #    目录里放 `immich_amap static` 生成的 style-*.json。
  mapstyle:
    image: nginx:alpine
    container_name: immich-mapstyle
    restart: unless-stopped
    ports:
      - "${MAPSTYLE_PORT:-9003}:80"
    volumes:
      - "${STYLE_DIR:-./dist/mapstyles}:/usr/share/nginx/html:ro"
      - "${NGINX_CONF:-./deploy/nginx/style-server.conf}:/etc/nginx/conf.d/default.conf:ro"

  # ③ 可选：把中文地名库挂进 Immich。
  #    在已有的 immich-server 服务里追加一行（路径按自己的宿主机目录替换）：
  #
  #    immich-server:
  #      volumes:
  #        - /path/to/immich/geodata:/build/geodata:ro
  #
  #    geodata 目录的生成方式见 docs/geodata-cn.md。

volumes:
  tile-proxy-cache:

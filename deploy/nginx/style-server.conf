# Immich 地图样式静态托管（只读，给手机端/桌面端提供 http(s) 的 style.json）
#
# 用法：由仓库根目录 compose.yaml 的 mapstyle 服务挂载为
#   /etc/nginx/conf.d/default.conf
# 站点根目录 /usr/share/nginx/html 对应宿主机上的样式输出目录
# （默认 ./dist/mapstyles，可用 .env 的 STYLE_DIR 覆盖）。
#
# 背景：手机端 maplibre_gl 原生 SDK 不接受 data: URL，必须走真实 http 地址
#       （见 docs/mobile.md）。样式文件需可被 nginx worker 读取。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 浏览器从 Immich 页面(:2283)跨域取 style.json，需要 CORS
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    # 样式随时可能改，别让浏览器老缓存（改完刷新即生效，不用重启容器）
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
